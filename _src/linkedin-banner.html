<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>LinkedIn banner — Virginia Sanchez</title>
<!-- Fuente de _src/linkedin-banner.png (1584x396, tamaño de fondo de LinkedIn).
     La foto de perfil tapa la esquina inferior izquierda, por eso el texto va a la derecha. -->
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@700;800&family=DM+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; }
  body {
    position: relative; width: 1584px; height: 396px; overflow: hidden;
    font-family: "DM Sans", "Segoe UI", sans-serif; color: #fff;
    background:
      radial-gradient(ellipse 45% 90% at 88% 40%, rgba(242,122,84,.28), transparent 65%),
      linear-gradient(120deg, #14110f 0%, #1e1a17 55%, #2b2521 100%);
  }
  .kanji {
    position: absolute; left: 380px; top: -70px;
    font-family: "Shippori Mincho", serif; font-weight: 800; font-size: 520px; line-height: 1;
    color: rgba(255,255,255,.04); letter-spacing: -0.05em;
  }
  .maki {
    position: absolute; border-radius: 50%;
    background:
      radial-gradient(circle at 42% 42%, #f27a54 0 20%, transparent 21%),
      radial-gradient(circle at 60% 58%, #a8c256 0 11%, transparent 12%),
      radial-gradient(circle, #fffdf8 0 58%, #1a2420 59% 100%);
    box-shadow: 0 14px 30px rgba(0,0,0,.4);
  }
  .m1 { width: 120px; height: 120px; left: 470px; top: 60px; }
  .m2 { width: 74px; height: 74px; left: 620px; top: 190px; }
  .m3 { width: 50px; height: 50px; left: 410px; top: 230px; opacity: .85; }
  .m4 { width: 38px; height: 38px; left: 720px; top: 70px; opacity: .7; }
  .copy { position: absolute; right: 90px; top: 50%; transform: translateY(-50%); text-align: right; }
  .role { display: flex; justify-content: flex-end; align-items: center; gap: 18px; font-size: 25px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; }
  .role i { width: 54px; height: 3px; background: #f27a54; }
  h1 { margin: 16px 0 14px; font-family: "Shippori Mincho", Georgia, serif; font-weight: 800; font-size: 60px; line-height: 1.1; }
  h1 span { color: #f27a54; }
  .url { font-size: 22px; font-weight: 500; color: rgba(255,255,255,.72); }
  .hanko { position: absolute; right: 90px; top: 34px; width: 0; height: 0; }
</style>
</head>
<body>
  <div class="kanji">寿司</div>
  <span class="maki m1"></span><span class="maki m2"></span><span class="maki m3"></span><span class="maki m4"></span>
  <div class="copy">
    <div class="role">Sushiwoman<i></i>Categoría A</div>
    <h1>Precisión, técnica y estética<br>en <span>cada pieza.</span></h1>
    <div class="url">chefvirginiasanchez.com</div>
  </div>
</body>
</html>
