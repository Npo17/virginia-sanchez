<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>OG image — Virginia Sanchez</title>
<!-- Fuente de assets/og.jpg (1200x630). Regenerar con Edge headless:
     msedge --headless=new --window-size=1200,630 --screenshot=og.png _src/og.html -->
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@800&family=DM+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; }
  body {
    position: relative; width: 1200px; height: 630px; overflow: hidden; box-sizing: border-box;
    display: grid; grid-template-columns: 1fr 360px; align-items: center; gap: 60px; padding: 0 80px;
    font-family: "DM Sans", "Segoe UI", sans-serif; color: #fff;
    background: radial-gradient(ellipse 60% 60% at 82% 30%, rgba(242,122,84,.25), transparent 65%), linear-gradient(160deg, #14110f, #1e1a17 55%, #2b2521);
  }
  .kanji { position: absolute; left: 470px; top: -40px; font-family: "Shippori Mincho", serif; font-weight: 800; font-size: 520px; line-height: 1; color: rgba(255,255,255,.035); writing-mode: vertical-rl; }
  h1 { position: relative; margin: 0 0 26px; font-family: "Shippori Mincho", Georgia, serif; font-weight: 800; font-size: 100px; line-height: 1; }
  h1 span { color: #f27a54; }
  p { position: relative; margin: 0; font-size: 30px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; }
  p i { display: inline-block; width: 50px; height: 3px; margin: 0 16px 9px; background: #f27a54; }
  small { position: relative; display: block; margin-top: 30px; font-size: 26px; font-weight: 500; color: rgba(255,255,255,.72); }
  .photo { position: relative; height: 470px; }
  .photo::before { content: ""; position: absolute; inset: 16px -16px -16px 16px; border: 3px solid #f27a54; border-radius: 24px; }
  .photo img { position: relative; width: 100%; height: 100%; object-fit: cover; display: block; border-radius: 24px; }
  .hanko { position: absolute; left: -40px; bottom: 34px; width: 110px; height: 110px; border-radius: 14px; background: #c8321e; transform: rotate(-8deg); display: grid; place-items: center; align-content: center; box-shadow: inset 0 0 0 4px #c8321e, inset 0 0 0 7px rgba(255,255,255,.85); }
  .hanko span { font-size: 14px; font-weight: 700; letter-spacing: .2em; }
  .hanko strong { font-family: "Shippori Mincho", serif; font-size: 56px; line-height: .95; }
</style>
</head>
<body>
  <div class="kanji">寿司</div>
  <div>
    <h1>Virginia <span>Sanchez</span></h1>
    <p>Sushiwoman<i></i>Categoría A</p>
    <small>De Categoría C a A en 12 meses · Rosario</small>
  </div>
  <div class="photo">
    <img src="../assets/profile.jpg" alt="">
    <div class="hanko"><span>CAT.</span><strong>A</strong></div>
  </div>
</body>
</html>
